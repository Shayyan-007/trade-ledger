<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Ledger</title>
<meta name="description" content="Private trading journal: daily plan and review, trade log, stats, P&L calendar and playbook.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16202A" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section id="authScreen" class="auth" hidden>
  <form id="authForm" class="authcard" autocomplete="on" data-mode="signin">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="7" width="3" height="9" fill="var(--gain)"/><line x1="4.5" y1="4" x2="4.5" y2="19" stroke="var(--gain)" stroke-width="1.4"/><rect x="10" y="5" width="3" height="7" fill="var(--loss)"/><line x1="11.5" y1="2" x2="11.5" y2="15" stroke="var(--loss)" stroke-width="1.4"/><rect x="17" y="9" width="3" height="8" fill="var(--gain)"/><line x1="18.5" y1="6" x2="18.5" y2="20" stroke="var(--gain)" stroke-width="1.4"/></svg>
      Trade Ledger
    </div>
    <h1 id="authTitle">Sign in</h1>
    <label class="f" id="authEmailWrap">Email<input id="authEmail" type="email" autocomplete="username" required></label>
    <label class="f" id="authPwWrap">Password<input id="authPw" type="password" autocomplete="current-password" minlength="6"></label>
    <p id="authMsg" class="authmsg" role="status" hidden></p>
    <button class="primary" id="authSubmit" type="submit">Sign in</button>
    <div class="authlinks">
      <button type="button" class="ghost" id="toReset">Forgot password?</button>
      <button type="button" class="ghost" id="toSignup">Create account</button>
      <button type="button" class="ghost" id="toSignin" hidden>Back to sign in</button>
    </div>
  </form>
</section>

<div id="appShell" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="7" width="3" height="9" fill="var(--gain)"/><line x1="4.5" y1="4" x2="4.5" y2="19" stroke="var(--gain)" stroke-width="1.4"/><rect x="10" y="5" width="3" height="7" fill="var(--loss)"/><line x1="11.5" y1="2" x2="11.5" y2="15" stroke="var(--loss)" stroke-width="1.4"/><rect x="17" y="9" width="3" height="8" fill="var(--gain)"/><line x1="18.5" y1="6" x2="18.5" y2="20" stroke="var(--gain)" stroke-width="1.4"/></svg>
      Trade Ledger
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Today</span></a>
      <a href="#trades"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/></svg><span>Trades</span></a>
      <a href="#stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"/></svg><span>Stats</span></a>
      <a href="#calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg><span>Calendar</span></a>
      <a href="#playbook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8"/></svg><span>Playbook</span></a>
      <a href="#account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Account</span></a>
    </nav>
  </div>
</header>
<div class="wrap"><main id="view">
  <div class="panel"><div class="empty"><h2>Opening your journal…</h2><p>Your trades, daily notes and playbook load here in a moment.</p></div></div>
</main></div>
</div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
